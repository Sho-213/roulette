<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掃除ルーレット</title>
  
  <!-- Google Fonts（丸みとモダンさを両立したスタイリッシュなフォント） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <!-- 外部ライブラリ（QRコード生成 & Firebaseリアルタイムデータベース） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <style>
    /* -------------------------------------------------------------
       カラーパレット（ライトモード＝元コードのパステル配色）
    ------------------------------------------------------------- */
    :root {
      --bg-base: #f7f7fc;
      --bg-grad-1: #d9d3ff;
      --bg-grad-2: #c0f5e8;
      --ink: #182033;
      --muted: #71809b;
      --paper: rgba(255, 253, 248, 0.92);
      --card-border: rgba(255, 255, 255, 0.95);
      --card-shadow: 0 20px 50px rgba(44, 37, 90, 0.12);
      --deco-circle: #ede9ff;
      --purple: #6548ed;
      --violet: #9a62ff;
      --mint: #37d5ae;
      --badge-bg: #e9e5ff;
      --badge-ink: #5540d2;
      --input-bg: #ffffff;
      --input-border: #dedcea;
      --item-bg: #f6f5fb;
      --item-border: transparent;
      --item-elim-bg: #f1f0f4;
      --item-elim-ink: #9b97a7;
      --winner-bg: linear-gradient(100deg, #fff3c9, #fffaf0);
      --winner-border: #ffd76e;
      --wheel-rim: linear-gradient(140deg, #ffffff, #e8e4ff);
      --wheel-shadow: 0 14px 25px rgba(76, 61, 147, 0.18), inset 0 0 0 1px #ffffff;
      --result-ink: #432eae;
      --danger-bg: #fff1f2;
      --danger-hover: #ffe0e3;
      --danger-ink: #e25667;
      --qr-btn-bg: #272a4b;
      --modal-bg: #fffdf8;
      --toggle-bg: rgba(101, 72, 237, 0.1);
      --toggle-hover: rgba(101, 72, 237, 0.18);
      --font-sans: "Plus Jakarta Sans", "Noto Sans JP", "Hiragino Sans", sans-serif;
      --font-display: "Zen Maru Gothic", "Plus Jakarta Sans", "Noto Sans JP", sans-serif;
    }

    /* -------------------------------------------------------------
       ダークモードのカラーパレット（深いミッドナイト・グラス）
    ------------------------------------------------------------- */
    html[data-theme="dark"] {
      --bg-base: #0d0f1a;
      --bg-grad-1: rgba(101, 72, 237, 0.28);
      --bg-grad-2: rgba(55, 213, 174, 0.20);
      --ink: #f3f4fa;
      --muted: #98a2bd;
      --paper: rgba(22, 26, 45, 0.84);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --deco-circle: rgba(101, 72, 237, 0.14);
      --purple: #9b85ff;
      --violet: #b18aff;
      --mint: #37d5ae;
      --badge-bg: rgba(101, 72, 237, 0.24);
      --badge-ink: #c7baff;
      --input-bg: rgba(13, 15, 26, 0.75);
      --input-border: rgba(255, 255, 255, 0.12);
      --item-bg: rgba(255, 255, 255, 0.05);
      --item-border: rgba(255, 255, 255, 0.06);
      --item-elim-bg: rgba(255, 255, 255, 0.02);
      --item-elim-ink: #646d87;
      --winner-bg: linear-gradient(100deg, rgba(255, 200, 55, 0.22), rgba(154, 98, 255, 0.18));
      --winner-border: rgba(255, 215, 110, 0.55);
      --wheel-rim: linear-gradient(140deg, #252b48, #15192d);
      --wheel-shadow: 0 18px 36px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      --result-ink: #c4b5fd;
      --danger-bg: rgba(244, 63, 94, 0.15);
      --danger-hover: rgba(244, 63, 94, 0.26);
      --danger-ink: #fb7185;
      --qr-btn-bg: #313866;
      --modal-bg: #171b30;
      --toggle-bg: rgba(255, 255, 255, 0.08);
      --toggle-hover: rgba(255, 255, 255, 0.16);
    }

    /* -------------------------------------------------------------
       全体レイアウト・リセットスタイル
    ------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 5% 0%, var(--bg-grad-1) 0, transparent 31rem),
        radial-gradient(circle at 95% 95%, var(--bg-grad-2) 0, transparent 32rem);
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .container {
      display: flex;
      flex-direction: column;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px;
      gap: 22px;
    }

    @media (min-width: 850px) {
      .container {
        flex-direction: row;
        align-items: stretch;
        height: 100vh;
        max-height: 840px;
      }
    }

    /* 共通カードデザイン（グラスモーフィズム） */
    .main-content, .sidebar, .user-card {
      background: var(--paper);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    /* メインコンテンツ（ルーレット表示エリア） */
    .main-content {
      flex: 1.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 28px 25px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
    }

    .main-content::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--deco-circle);
      top: -180px;
      right: -130px;
      z-index: -1;
      transition: background 0.35s ease;
    }

    /* サイドバー（メンバー管理エリア） */
    .sidebar {
      flex: 1;
      padding: 26px 22px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .title-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 10px;
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 900;
    }

    h1 {
      font-size: clamp(26px, 3.8vw, 36px);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .host-badge {
      color: var(--badge-ink);
      background: var(--badge-bg);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    /* ダーク/ライト切り替えボタン */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--toggle-bg);
      color: var(--ink);
      border: 1px solid var(--card-border);
      box-shadow: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.17s, color 0.3s;
    }

    .theme-toggle:hover:not(:disabled) {
      background: var(--toggle-hover);
      transform: translateY(-1px);
      box-shadow: none;
    }

    .theme-toggle svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* ルーレットの土台と矢印 */
    .roulette-wrapper {
      position: relative;
      margin: 20px 0 16px;
      padding: 12px;
      border-radius: 50%;
      background: var(--wheel-rim);
      box-shadow: var(--wheel-shadow);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    canvas {
      display: block;
      width: min(72vw, 380px);
      height: auto;
      border-radius: 50%;
    }

    .arrow {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-inline: 15px solid transparent;
      border-top: 25px solid #ff5d75;
      z-index: 2;
      filter: drop-shadow(0 4px 4px rgba(67, 39, 97, 0.28));
    }

    /* -------------------------------------------------------------
       ボタン・入力フォームのスタイル
    ------------------------------------------------------------- */
    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 14px;
      color: white;
      background: linear-gradient(135deg, #7354ef, #4c75ee);
      box-shadow: 0 7px 14px rgba(87, 75, 196, 0.2);
      cursor: pointer;
      transition: transform 0.17s, box-shadow 0.17s, filter 0.17s, background 0.3s;
      font-family: var(--font-sans);
      font-weight: 700;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 11px 20px rgba(87, 75, 196, 0.28);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    #spin-btn {
      width: min(100%, 340px);
      border-radius: 16px;
      padding: 15px 30px;
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(120deg, #ff7f81, #f64f74);
      box-shadow: 0 11px 22px rgba(246, 79, 116, 0.28);
    }

    #result {
      min-height: 34px;
      margin-top: 14px;
      font-size: 22px;
      color: var(--result-ink);
      letter-spacing: -0.02em;
      transition: color 0.3s ease;
    }

    .notice {
      min-height: 20px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-heading h2 {
      font-size: 20px;
    }

    .member-count {
      color: var(--badge-ink);
      background: var(--badge-bg);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group-row {
      display: flex;
      gap: 8px;
    }

    .input-group input, 
    .input-group select, 
    .user-card input, 
    .user-card select {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      color: var(--ink);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      outline: 0;
      font: inherit;
      font-size: 14px;
      transition: border 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
    }

    .input-group input:focus, 
    .input-group select:focus, 
    .user-card input:focus, 
    .user-card select:focus {
      border-color: #876df3;
      box-shadow: 0 0 0 4px rgba(128, 100, 237, 0.14);
    }

    #add-btn {
      padding-inline: 18px;
    }

    /* メンバーリストのデザイン */
    #member-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      min-height: 150px;
      overflow-y: auto;
      padding: 2px;
    }

    @media (max-width: 849px) {
      #member-list {
        max-height: 320px;
      }
    }

    #member-list:empty::after {
      content: "参加者を待っています…";
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 34px 8px;
      border: 1px dashed var(--input-border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    #member-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px 9px 14px;
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 13px;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.25s, transform 0.15s;
    }

    #member-list li.winner {
      background: var(--winner-bg);
      box-shadow: inset 0 0 0 1.5px var(--winner-border);
    }

    #member-list li.eliminated {
      color: var(--item-elim-ink);
      text-decoration: line-through;
      background: var(--item-elim-bg);
    }

    .member-main {
      min-width: 0;
      overflow-wrap: anywhere;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .member-time {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    /* 個別削除ボタンのスタイル */
    .member-delete-btn {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 8px;
      color: var(--danger-ink);
      background: var(--danger-bg);
      box-shadow: none;
      flex-shrink: 0;
    }

    .member-delete-btn:hover:not(:disabled) {
      background: var(--danger-hover);
      box-shadow: none;
      transform: translateY(-1px);
    }

    .winner-actions {
      display: flex;
      width: min(100%, 340px);
      gap: 8px;
      margin: 4px 0 8px;
    }

    .winner-actions button {
      flex: 1;
      padding: 10px 8px;
      border-radius: 11px;
      box-shadow: none;
      font-size: 13px;
    }

    .keep-btn {
      background: #35b997;
    }

    .eliminate-btn {
      background: #ef6374;
    }

    .danger-btn {
      color: var(--danger-ink);
      background: var(--danger-bg);
      box-shadow: none;
    }

    .danger-btn:hover:not(:disabled) {
      background: var(--danger-hover);
      box-shadow: none;
    }

    #qr-btn {
      background: var(--qr-btn-bg);
    }

    /* モーダルウィンドウ（QRコード表示用） */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(15, 16, 36, 0.65);
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .modal-content {
      width: min(100%, 350px);
      padding: 28px;
      border-radius: 26px;
      background: var(--modal-bg);
      border: 1px solid var(--card-border);
      color: var(--ink);
      text-align: center;
      box-shadow: 0 25px 60px rgba(11, 11, 32, 0.35);
    }

    .modal-content h3 {
      font-size: 20px;
    }

    #qrcode {
      width: 184px;
      height: 184px;
      padding: 10px;
      margin: 20px auto !important;
      background: #ffffff;
      border: 1px solid #eeeaf8;
      border-radius: 18px;
    }

    #qrcode img {
      border-radius: 8px;
    }

    .hidden {
      display: none !important;
    }

    /* 参加者用入力画面のスタイル */
    .user-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .user-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 28px 30px;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .user-card-top {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: -6px;
    }

    .join-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 2px;
      color: #fff;
      border-radius: 19px;
      background: linear-gradient(145deg, #8061f4, #4b7bed);
      box-shadow: 0 12px 22px rgba(93, 85, 214, 0.28);
      font-size: 26px;
    }

    .user-card h2 {
      font-size: 26px;
    }

    .user-card .notice {
      font-size: 13px;
    }

    .user-card input, 
    .user-card select, 
    .user-card button#submit-join-btn {
      padding: 14px;
      font-size: 15px;
      width: 100%;
    }

    .user-card button#submit-join-btn {
      border-radius: 14px;
      background: linear-gradient(120deg, #41cfa7, #2fbbbc);
      box-shadow: 0 10px 18px rgba(43, 185, 171, 0.25);
      font-size: 16px;
      margin-top: 4px;
    }

    .form-label {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: -10px;
    }

    @media (max-width: 430px) {
      .container { padding: 14px; }
      .main-content { padding: 24px 16px 20px; }
      .sidebar { padding: 22px 16px; }
      .user-card { padding: 24px 20px 26px; }
    }
  </style>
</head>
<body>

  <!-- アプリケーションが描画されるルート要素 -->
  <div id="app"></div>

  <script>
    // -------------------------------------------------------------
    // 0. テーマ管理（ライトモード / ダークモード切り替え）
    // -------------------------------------------------------------
    const THEME_STORAGE_KEY = "cleaning-roulette-theme";
    let onThemeChangeCallback = null;

    function getInitialTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);
      if (saved === "dark" || saved === "light") return saved;
      return "light"; // デフォルトは元コードと同じパステルなライトモード
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_STORAGE_KEY, theme);
      updateThemeToggleButtons(theme);
      if (typeof onThemeChangeCallback === "function") {
        onThemeChangeCallback(theme);
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      applyTheme(current === "dark" ? "light" : "dark");
    }

    function renderThemeToggleButton() {
      return `
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="テーマ切り替え">
          <span class="theme-icon"></span>
          <span class="theme-label"></span>
        </button>
      `;
    }

    function updateThemeToggleButtons(theme) {
      const isDark = theme === "dark";
      const sunSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
      const moonSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

      document.querySelectorAll("[data-theme-toggle]").forEach(btn => {
        btn.querySelector(".theme-icon").innerHTML = isDark ? sunSvg : moonSvg;
        btn.querySelector(".theme-label").textContent = isDark ? "ライト" : "ダーク";
      });
    }

    function bindThemeToggles() {
      document.querySelectorAll("[data-theme-toggle]").forEach(btn => {
        btn.addEventListener("click", toggleTheme);
      });
      updateThemeToggleButtons(document.documentElement.getAttribute("data-theme") || "light");
    }

    // 初期テーマを即座に適用
    document.documentElement.setAttribute("data-theme", getInitialTheme());

    // -------------------------------------------------------------
    // 1. Firebaseの設定と初期化
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBSyPytTDEdSWes8n0-4o3_Hu85oHe6EUI",
      authDomain: "roulette-e24a5.firebaseapp.com",
      databaseURL: "https://roulette-e24a5-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "roulette-e24a5",
      storageBucket: "roulette-e24a5.firebasestorage.app",
      messagingSenderId: "361439895925",
      appId: "1:361439895925:web:15a270ff7844b966eb333c",
      measurementId: "G-NSPL1FB5J5"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const membersRef = db.ref("roulette/members");
    const joinRequestsRef = db.ref("roulette/joinRequests");
    
    const params = new URLSearchParams(location.search);
    const isJoinMode = params.get("mode") === "join";
    const appEl = document.getElementById("app");

    // 登校時間ごとの時間枠と、ルーレットの「当たりやすさ（重み）」の定義
    const TIME_SLOTS = [
      { label: "9:30~10:00(朝礼前)", weight: 0.5 },
      { label: "10:00~11:00(1時間目)", weight: 0.8 },
      { label: "11:00~12:00(2時間目)", weight: 1.1 },
      { label: "12:00~13:00(昼休み)", weight: 1.4 },
      { label: "13:00~14:00(3時間目)", weight: 1.7 },
      { label: "14:00~15:00(4時間目)", weight: 2.0 }
    ];

    function safeName(value) { 
      return String(value || "").trim().slice(0, 40); 
    }
    
    function memberKey(name) {
      return `join-${encodeURIComponent(name.toLocaleLowerCase()).replace(/\./g, "%2E")}`;
    }

    // -------------------------------------------------------------
    // 2. 画面ごとの振り分け処理（参加者用画面 vs ホスト用画面）
    // -------------------------------------------------------------
    if (isJoinMode) {
      // -----------------------------------------------------------
      // [A] スマホから参加するユーザー用の画面構築
      // -----------------------------------------------------------
      appEl.innerHTML = `
        <div class="user-container">
          <div class="user-card">
            <div class="user-card-top">
              ${renderThemeToggleButton()}
            </div>
            <div class="join-mark">✦</div>
            <p class="eyebrow">JOIN THE GAME</p>
            <h2>ルーレットに参加</h2>
            <p class="notice">遅く来るほどルーレットの幅（当たりやすさ）が大きくなります！</p>
            
            <p class="form-label">名前</p>
            <input id="join-name-input" maxlength="40" placeholder="あなたの名前" autocomplete="off">
            
            <p class="form-label">登校時間は？</p>
            <select id="join-time-select">
              ${TIME_SLOTS.map(slot => `<option value="${slot.label}">${slot.label}</option>`).join('')}
            </select>

            <button id="submit-join-btn" disabled>接続を確認中…</button>
            <p id="join-status" class="notice">Firebaseへ接続しています…</p>
          </div>
        </div>
      `;

      bindThemeToggles();

      const input = document.getElementById("join-name-input");
      const select = document.getElementById("join-time-select");
      const button = document.getElementById("submit-join-btn");
      const status = document.getElementById("join-status");
      let isConnected = false;

      db.ref(".info/connected").on("value", snapshot => {
        isConnected = snapshot.val() === true;
        button.disabled = !isConnected;
        button.textContent = isConnected ? "送信して参加" : "接続を確認中…";
        if (!isConnected) {
          status.style.color = "#e74c3c";
          status.textContent = "Firebaseに接続できません。";
        } else if (!status.textContent.includes("送信")) {
          status.style.color = "";
          status.textContent = "名前と登校時間を選択して送信してください。";
        }
      });

      async function submit() {
        if (!isConnected) return;
        const name = safeName(input.value);
        const arrivalTime = select.value;
        if (!name) { 
          status.style.color = "#e74c3c"; 
          status.textContent = "名前を入力してください。"; 
          return; 
        }
        
        button.disabled = true; 
        status.style.color = ""; 
        status.textContent = "送信中…";
        
        try {
          await joinRequestsRef.push({ 
            name, 
            arrivalTime: arrivalTime || TIME_SLOTS[0].label, 
            createdAt: firebase.database.ServerValue.TIMESTAMP 
          });
          status.style.color = "#2ecc71"; 
          status.textContent = `「${name}」さん（${arrivalTime}）を送信しました。`;
          input.value = "";
        } catch (error) {
          console.error(error);
          status.style.color = "#e74c3c"; 
          status.textContent = "送信できませんでした。";
        } finally { 
          button.disabled = !isConnected; 
        }
      }

      button.addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

    } else {
      // -----------------------------------------------------------
      // [B] PCなどでルーレットを回すホスト用の画面構築
      // -----------------------------------------------------------
      appEl.innerHTML = `
        <div class="container">
          <!-- メイン（ルーレット描写エリア） -->
          <main class="main-content">
            <div class="top-bar">
              <p class="eyebrow">ROULETTE</p>
              <div class="header-controls">
                ${renderThemeToggleButton()}
                <span class="host-badge">HOST</span>
              </div>
            </div>
            <div class="title-row">
              <h1>掃除ルーレット!</h1>
            </div>
            <div class="roulette-wrapper">
              <div class="arrow" aria-hidden="true"></div>
              <canvas id="roulette" width="400" height="400"></canvas>
            </div>
            <button id="spin-btn">回す</button>
            <h2 id="result"></h2>
            <div id="winner-actions" class="winner-actions hidden"></div>
            <p id="host-status" class="notice"></p>
          </main>
          
          <!-- サイドバー（メンバー一覧・追加・管理用） -->
          <aside class="sidebar">
            <div class="side-heading">
              <h2>メンバー</h2>
              <span id="member-count" class="member-count">0人</span>
            </div>
            <div class="input-group">
              <input id="member-input" maxlength="40" placeholder="メンバーを追加">
              <div class="input-group-row">
                <select id="member-time-select">
                  ${TIME_SLOTS.map(slot => `<option value="${slot.label}">${slot.label}</option>`).join('')}
                </select>
                <button id="add-btn">追加</button>
              </div>
            </div>
            <ul id="member-list"></ul>
            <button id="qr-btn">QRコードを表示</button>
            <button id="reset-btn" class="danger-btn">全削除</button>
            
            <!-- 参加用QRコードを表示するポップアップモーダル -->
            <div id="qr-modal" class="modal hidden">
              <div class="modal-content">
                <h3>スマホで読み込んで参加</h3>
                <div id="qrcode" style="margin:15px auto"></div>
                <button id="close-qr-btn">閉じる</button>
              </div>
            </div>
          </aside>
        </div>
      `;

      bindThemeToggles();

      let members = [];
      let currentAngle = 0;
      let isSpinning = false;
      let roundMembers = null;
      let lastWinnerId = null;
      
      const canvas = document.getElementById("roulette");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spin-btn");
      const addBtn = document.getElementById("add-btn");
      const input = document.getElementById("member-input");
      const selectTime = document.getElementById("member-time-select");
      const list = document.getElementById("member-list");
      const memberCount = document.getElementById("member-count");
      const result = document.getElementById("result");
      const hostStatus = document.getElementById("host-status");
      const winnerActions = document.getElementById("winner-actions");
      const colors = ["#f39c12", "#e74c3c", "#9b59b6", "#3498db", "#1abc9c", "#2ecc71"];

      // テーマ変更時にルーレット盤面も再描画
      onThemeChangeCallback = () => drawRoulette();

      function getWeight(arrivalTime) {
        const slot = TIME_SLOTS.find(s => s.label === arrivalTime);
        return slot ? slot.weight : TIME_SLOTS[0].weight;
      }

      function reportHostError(error) {
        console.error("Firebaseエラー", error);
        hostStatus.style.color = "#e74c3c";
        hostStatus.textContent = `Firebaseエラー: ${error.message}`;
      }
      
      hostStatus.textContent = "ホストとして操作中";
      hostStatus.style.color = "#2ecc71";

      listenForJoinRequests();

      membersRef.on("value", snapshot => {
        const data = snapshot.val() || {};
        const unique = new Map();
        
        Object.entries(data).forEach(([id, rawMember]) => {
          const isObject = rawMember && typeof rawMember === "object";
          const name = safeName(isObject ? rawMember.name : rawMember);
          
          let arrivalTime = (isObject && rawMember.arrivalTime) ? rawMember.arrivalTime : null;
          if (!arrivalTime) {
            arrivalTime = TIME_SLOTS[0].label;
            membersRef.child(id).update({ arrivalTime, eliminated: Boolean(isObject && rawMember.eliminated) });
          }

          if (!name) return;
          const key = name.toLocaleLowerCase();
          const eliminated = Boolean(isObject && rawMember.eliminated);
          
          if (unique.has(key)) {
            const existing = unique.get(key);
            existing.ids.push(id);
            existing.arrivalTime = arrivalTime;
            if (existing.eliminated && !eliminated) { 
              existing.id = id; 
              existing.eliminated = false; 
            }
          } else {
            unique.set(key, { id, ids: [id], name, arrivalTime, eliminated });
          }
        });
        
        members = [...unique.values()];
        if (!isSpinning) roundMembers = null;
        updateUI();
      }, reportHostError);

      function listenForJoinRequests() {
        joinRequestsRef.on("child_added", async snapshot => {
          const val = snapshot.val();
          const name = safeName(val && val.name);
          const arrivalTime = (val && val.arrivalTime) ? val.arrivalTime : TIME_SLOTS[0].label;
          if (!name) return;
          try {
            await membersRef.child(memberKey(name)).set({ name, arrivalTime, eliminated: false });
            await snapshot.ref.remove();
          } catch (error) { 
            reportHostError(error); 
          }
        }, reportHostError);
      }

      function updateUI() {
        list.innerHTML = "";
        memberCount.textContent = `${members.filter(member => !member.eliminated).length}人`;
        
        members.forEach(member => {
          const li = document.createElement("li");
          const label = document.createElement("div");
          label.className = "member-main"; 
          label.innerHTML = `<span>${member.name}</span><span class="member-time">${member.arrivalTime || ''}</span>`;
          
          if (member.eliminated) li.classList.add("eliminated");
          if (member.id === lastWinnerId && !member.eliminated) li.classList.add("winner");

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "member-delete-btn";
          delBtn.textContent = "削除";
          delBtn.addEventListener("click", () => {
            if (!confirm(`「${member.name}」さんを削除しますか？`)) return;
            if (member.id === lastWinnerId) {
              lastWinnerId = null;
              winnerActions.classList.add("hidden");
            }
            Promise.all(member.ids.map(id => membersRef.child(id).remove())).catch(reportHostError);
          });
          
          li.append(label, delBtn);
          list.appendChild(li);
        });
        drawRoulette();
      }

      function getSlices(options) {
        const totalWeight = options.reduce((sum, m) => sum + getWeight(m.arrivalTime), 0);
        let currentStart = 0;
        return options.map(member => {
          const weight = getWeight(member.arrivalTime);
          const arc = (weight / (totalWeight || 1)) * 2 * Math.PI;
          const slice = { member, startAngle: currentStart, endAngle: currentStart + arc, arc };
          currentStart += arc;
          return slice;
        });
      }

      function drawRoulette() {
        const options = roundMembers || members.filter(member => !member.eliminated);
        const n = options.length;
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        ctx.clearRect(0, 0, 400, 400);
        
        if (!n) { 
          ctx.beginPath(); 
          ctx.arc(200, 200, 184, 0, 2 * Math.PI); 
          ctx.fillStyle = isDark ? "#1e243e" : "#eae8f4"; 
          ctx.fill(); 
          ctx.fillStyle = isDark ? "#98a2bd" : "#71809b"; 
          ctx.font = "700 17px 'Zen Maru Gothic', 'Noto Sans JP', sans-serif"; 
          ctx.textAlign = "center"; 
          ctx.fillText("メンバーを追加してください", 200, 206); 
          return; 
        }
        
        const slices = getSlices(options);
        slices.forEach((slice, i) => {
          const start = currentAngle + slice.startAngle;
          const end = currentAngle + slice.endAngle;
          
          ctx.beginPath(); 
          ctx.arc(200, 200, 184, start, end); 
          ctx.lineTo(200, 200); 
          ctx.fillStyle = colors[i % colors.length]; 
          ctx.fill(); 
          ctx.strokeStyle = isDark ? "rgba(13, 15, 26, 0.65)" : "rgba(255, 255, 255, 0.85)";
          ctx.lineWidth = 2.5;
          ctx.stroke(); 
          
          ctx.save(); 
          ctx.translate(200, 200); 
          ctx.rotate(start + slice.arc / 2); 
          ctx.textAlign = "right"; 
          ctx.fillStyle = "#ffffff"; 
          ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
          ctx.shadowBlur = 4;
          ctx.font = "900 15px 'Zen Maru Gothic', 'Noto Sans JP', sans-serif"; 
          ctx.fillText(slice.member.name, 162, 5); 
          ctx.restore(); 
        });

        // 中央のセンターキャップ
        ctx.beginPath();
        ctx.arc(200, 200, 20, 0, 2 * Math.PI);
        ctx.fillStyle = isDark ? "#171b30" : "#fffdf8";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = isDark ? "rgba(255, 255, 255, 0.2)" : "rgba(101, 72, 237, 0.25)";
        ctx.stroke();
      }

      function memberUnderPointer(options) {
        const pointerAngle = 1.5 * Math.PI;
        const wheelAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const offset = ((pointerAngle - wheelAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const slices = getSlices(options);
        const hit = slices.find(s => offset >= s.startAngle && offset < s.endAngle);
        return hit ? hit.member : options[0];
      }

      function showWinnerActions(winner) {
        winnerActions.innerHTML = "";
        winnerActions.classList.remove("hidden");
        
        const keep = document.createElement("button");
        const eliminate = document.createElement("button");
        
        keep.textContent = "残す"; 
        keep.className = "keep-btn";
        eliminate.textContent = "削除"; 
        eliminate.className = "eliminate-btn";
        
        keep.addEventListener("click", () => { 
          lastWinnerId = null; 
          winnerActions.classList.add("hidden"); 
          updateUI(); 
        });
        
        eliminate.addEventListener("click", () => {
          lastWinnerId = null; 
          winnerActions.classList.add("hidden");
          Promise.all(winner.ids.map(id => membersRef.child(id).set({ 
            name: winner.name, 
            arrivalTime: winner.arrivalTime, 
            eliminated: true 
          }))).catch(reportHostError);
        });
        
        winnerActions.append(keep, eliminate);
      }

      function addMember() { 
        const name = safeName(input.value); 
        const arrivalTime = selectTime.value;
        if (name) { 
          membersRef.child(memberKey(name)).set({ name, arrivalTime, eliminated: false }).catch(reportHostError); 
          input.value = ""; 
        } 
      }
      
      addBtn.addEventListener("click", addMember); 
      input.addEventListener("keydown", e => { if (e.key === "Enter") addMember(); });

      spinBtn.addEventListener("click", () => {
        const eligibleMembers = members.filter(member => !member.eliminated);
        if (isSpinning || !eligibleMembers.length) return;
        
        roundMembers = eligibleMembers.slice();
        isSpinning = true; 
        result.textContent = ""; 
        winnerActions.classList.add("hidden");
        
        const slices = getSlices(roundMembers);
        const totalWeight = roundMembers.reduce((sum, m) => sum + getWeight(m.arrivalTime), 0);
        
        let rand = Math.random() * totalWeight;
        let winningSlice = slices[0];
        for (const s of slices) {
          const w = getWeight(s.member.arrivalTime);
          if (rand < w) { winningSlice = s; break; }
          rand -= w;
        }

        const pointerAngle = 1.5 * Math.PI;
        const current = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const sliceCenter = winningSlice.startAngle + winningSlice.arc / 2;
        const desired = ((pointerAngle - sliceCenter) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const distance = ((desired - current + 2 * Math.PI) % (2 * Math.PI)) + (6 + Math.random() * 2) * 2 * Math.PI;
        
        const startAngle = currentAngle;
        const duration = 4200;
        const startTime = performance.now();
        
        function animate(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 4);
          currentAngle = startAngle + distance * eased;
          drawRoulette();
          
          if (t < 1) {
            requestAnimationFrame(animate);
          } else {
            isSpinning = false;
            const winner = memberUnderPointer(roundMembers);
            lastWinnerId = winner.id;
            result.textContent = `結果: ${winner.name}！`;
            showWinnerActions(winner);
            updateUI();
          }
        }
        requestAnimationFrame(animate);
      });

      document.getElementById("reset-btn").addEventListener("click", async () => {
        if (!confirm("全員削除しますか？")) return;
        const resetBtn = document.getElementById("reset-btn");
        resetBtn.disabled = true;
        try {
          const pending = await joinRequestsRef.once("value");
          await Promise.all(Object.keys(pending.val() || {}).map(id => joinRequestsRef.child(id).remove()));
          await membersRef.remove();
          members = []; 
          roundMembers = null; 
          lastWinnerId = null; 
          currentAngle = 0; 
          result.textContent = ""; 
          winnerActions.classList.add("hidden");
          updateUI();
          hostStatus.style.color = "#2ecc71";
          hostStatus.textContent = "メンバーを全削除しました。";
        } catch (error) { 
          reportHostError(error); 
        } finally { 
          resetBtn.disabled = false; 
        }
      });

      const modal = document.getElementById("qr-modal");
      document.getElementById("qr-btn").addEventListener("click", () => { 
        modal.classList.remove("hidden"); 
        const el = document.getElementById("qrcode"); 
        el.innerHTML = ""; 
        new QRCode(el, { 
          text: `${location.origin}${location.pathname}?mode=join`, 
          width: 164, 
          height: 164 
        }); 
      });
      document.getElementById("close-qr-btn").addEventListener("click", () => modal.classList.add("hidden"));
    }
  </script>
</body>
</html>
