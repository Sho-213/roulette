<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム同期ルーレット</title>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase (v10 Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
    }

    .container {
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        gap: 20px;
      }
    }

    .main-content {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .roulette-wrapper {
      position: relative;
      margin: 20px 0;
    }

    .arrow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      color: #e74c3c;
      z-index: 10;
    }

    #spin-btn {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    #spin-btn:disabled {
      background-color: #ccc;
    }

    .sidebar {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      display: flex;
      gap: 5px;
    }

    .input-group input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .danger-btn {
      background-color: #e74c3c;
      margin-top: 10px;
    }

    #member-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 5px;
    }

    #member-list li {
      padding: 5px 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    /* Modal styles */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 350px;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- 【ホスト用画面】 -->
  <div id="host-view" class="container">
    <main class="main-content">
      <h1>ルーレット</h1>
      <div class="roulette-wrapper">
        <div class="arrow">▼</div>
        <canvas id="roulette" width="400" height="400"></canvas>
      </div>
      <button id="spin-btn">スタート！</button>
      <h2 id="result"></h2>
    </main>

    <aside class="sidebar">
      <h2>メンバー一覧</h2>
      <div class="input-group">
        <input type="text" id="member-input" placeholder="名前を入力">
        <button id="add-btn">追加</button>
      </div>
      
      <ul id="member-list"></ul>

      <div class="qr-section">
        <button id="qr-btn">参加用QRコードを表示</button>
        <button id="reset-btn" class="danger-btn">メンバー全削除</button>
        
        <div id="qr-modal" class="modal hidden">
          <div class="modal-content">
            <h3>スマホで読み込んで参加</h3>
            <div id="qrcode"></div>
            <button id="close-qr-btn">閉じる</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 【ユーザー（参加者）用画面：初期状態では非表示】 -->
  <div id="user-view" class="container hidden" style="justify-content: center; align-items: center; min-height: 80vh;">
    <div class="modal-content" style="box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
      <h2>ルーレット参加</h2>
      <p style="font-size: 14px; color: #666;">あなたの名前を入力して送信してください。</p>
      <input type="text" id="join-name-input" placeholder="名前を入力">
      <button id="submit-join-btn" style="width: 100%; padding: 10px; background-color: #2ecc71;">送信して参加する</button>
      <p id="join-status" style="font-size: 13px; color: #e74c3c;"></p>
    </div>
  </div>

  <script>
    // --- Firebase 設定 (Realtime Database用) ---
    const firebaseConfig = {
  apiKey: "AIzaSyBSyPytTDEdSWes8n0-4o3_Hu85oHe6EUI",
  authDomain: "roulette-e24a5.firebaseapp.com",
  databaseURL: "https://roulette-e24a5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roulette-e24a5",
  storageBucket: "roulette-e24a5.firebasestorage.app",
  messagingSenderId: "361439895925",
  appId: "1:361439895925:web:15a270ff7844b966eb333c",
  measurementId: "G-NSPL1FB5J5"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const membersRef = db.ref("roulette/members");

    let members = [];
    let currentAngle = 0;
    let isSpinning = false;

    // 画面の判定（URLパラメータに ?mode=join があればユーザー画面にする）
    const urlParams = new URLSearchParams(window.location.search);
    const isUserMode = urlParams.get("mode") === "join";

    const hostView = document.getElementById("host-view");
    const userView = document.getElementById("user-view");

    if (isUserMode) {
      // ユーザー画面を表示、ホスト画面を隠す
      hostView.classList.add("hidden");
      userView.classList.remove("hidden");
    }

    // DOM要素（ホスト用）
    const canvas = document.getElementById("roulette");
    const ctx = canvas ? canvas.getContext("2d") : null;
    const spinBtn = document.getElementById("spin-btn");
    const memberInput = document.getElementById("member-input");
    const addBtn = document.getElementById("add-btn");
    const memberListEl = document.getElementById("member-list");
    const resultEl = document.getElementById("result");
    const qrBtn = document.getElementById("qr-btn");
    const qrModal = document.getElementById("qr-modal");
    const closeQrBtn = document.getElementById("close-qr-btn");
    const resetBtn = document.getElementById("reset-btn");

    // DOM要素（ユーザー用）
    const joinNameInput = document.getElementById("join-name-input");
    const submitJoinBtn = document.getElementById("submit-join-btn");
    const joinStatus = document.getElementById("join-status");

    const colors = ["#f39c12", "#e74c3c", "#9b59b6", "#3498db", "#1abc9c", "#2ecc71"];

    // リアルタイム同期
    membersRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        members = Array.isArray(data) ? data : Object.values(data);
      } else {
        members = [];
      }
      if (!isUserMode) {
        updateUI();
      }
    });

    function updateUI() {
      if (!memberListEl) return;
      memberListEl.innerHTML = "";
      members.forEach((m) => {
        const li = document.createElement("li");
        li.textContent = m;
        memberListEl.appendChild(li);
      });
      drawRoulette();
    }

    function addMember(name, callback) {
      if (!name.trim()) return;
      const newMembers = [...members, name.trim()];
      membersRef.set(newMembers).then(() => {
        if (callback) callback();
      });
    }

    function resetMembers() {
      if (confirm("全員削除しますか？")) {
        membersRef.set(null);
      }
    }

    function drawRoulette() {
      if (!ctx) return;
      const numOptions = members.length;
      const arcSize = (2 * Math.PI) / (numOptions || 1);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numOptions === 0) {
        ctx.beginPath();
        ctx.arc(200, 200, 180, 0, 2 * Math.PI);
        ctx.fillStyle = "#e0e0e0";
        ctx.fill();
        ctx.fillStyle = "#666";
        ctx.font = "18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("メンバーを追加してください", 200, 205);
        return;
      }

      for (let i = 0; i < numOptions; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.arc(200, 200, 180, angle, angle + arcSize);
        ctx.lineTo(200, 200);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(members[i], 160, 5);
        ctx.restore();
      }
    }

    if (spinBtn) {
      spinBtn.addEventListener("click", () => {
        if (isSpinning || members.length === 0) return;
        isSpinning = true;
        resultEl.textContent = "";

        const spinAngle = Math.random() * 10 + 20;
        let currentSpeed = spinAngle;

        function rotate() {
          currentSpeed *= 0.98;
          if (currentSpeed < 0.01) {
            isSpinning = false;
            determineWinner();
            return;
          }
          currentAngle += (currentSpeed * Math.PI) / 180;
          drawRoulette();
          requestAnimationFrame(rotate);
        }
        rotate();
      });
    }

    function determineWinner() {
      const numOptions = members.length;
      const arcSize = (2 * Math.PI) / numOptions;
      let normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const winnerIndex = Math.floor(normalizedAngle / arcSize);
      resultEl.textContent = `結果: ${members[winnerIndex]}！`;
    }

    if (addBtn) {
      addBtn.addEventListener("click", () => {
        addMember(memberInput.value, () => {
          memberInput.value = "";
        });
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", resetMembers);
    }

    let qrcodeObj = null;
    if (qrBtn) {
      qrBtn.addEventListener("click", () => {
        qrModal.classList.remove("hidden");
        const joinUrl = `${window.location.origin}${window.location.pathname}?mode=join`;

        if (!qrcodeObj) {
          qrcodeObj = new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 180,
            height: 180
          });
        }
      });
    }

    if (closeQrBtn) {
      closeQrBtn.addEventListener("click", () => {
        qrModal.classList.add("hidden");
      });
    }

    // ユーザー画面からの送信処理
    if (submitJoinBtn) {
      submitJoinBtn.addEventListener("click", () => {
        const name = joinNameInput.value.trim();
        if (!name) {
          joinStatus.textContent = "名前を入力してください";
          return;
        }
        submitJoinBtn.disabled = true;
        joinStatus.textContent = "送信中...";

        addMember(name, () => {
          joinStatus.style.color = "#2ecc71";
          joinStatus.textContent = "追加されました！ホストの画面を確認してください。";
          joinNameInput.value = "";
          setTimeout(() => {
            submitJoinBtn.disabled = false;
          }, 2000);
        });
      });
    }
  </script>
</body>
</html>
